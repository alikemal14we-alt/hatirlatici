name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo projesi olustur
        run: |
          npx create-expo-app@latest app --template blank --yes
          rm -f app/App.tsx app/App.ts
          cp App.js app/App.js
          cd app
          npx expo install expo-notifications @react-native-async-storage/async-storage

      - name: Uygulama ayarlari
        working-directory: app
        run: |
          node <<'JS'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          j.expo.name = 'Düzenli Hatırlatıcı';
          j.expo.slug = 'hatirlatici';
          j.expo.android = { ...(j.expo.android || {}), package: 'com.alikemal.hatirlatici', permissions: ['POST_NOTIFICATIONS', 'VIBRATE', 'RECEIVE_BOOT_COMPLETED', 'SCHEDULE_EXACT_ALARM'] };
          j.expo.plugins = [...(j.expo.plugins || []), 'expo-notifications'];
          fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          JS

      - name: Android projesi olustur
        working-directory: app
        run: npx expo prebuild --platform android

      - name: APK derle
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hatirlatici-apk
          path: app/android/app/build/outputs/apk/release/*.apk
