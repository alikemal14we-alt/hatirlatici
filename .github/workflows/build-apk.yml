name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo projesi olustur
        run: |
          npx create-expo-app@latest app --template blank --yes
          rm -f app/App.tsx app/App.ts
          cp App.js app/App.js
          cd app
          npx expo install expo-notifications expo-intent-launcher @react-native-async-storage/async-storage

      - name: Uygulama ayarlari
        working-directory: app
        run: |
          node <<'JS'
          const fs = require('fs');
          fs.mkdirSync('assets', { recursive: true });
          const sr = 22050, secs = 30, n = sr * secs, TAU = 2 * Math.PI;
          let ph = 0;
          const gens = {
            zil1: (t) => { const c = t % 3; let a = 0; for (const [s, e] of [[0, 0.45], [0.6, 1.05], [1.2, 1.65]]) if (c >= s && c < e) { const lt = c - s, env = Math.min(1, lt / 0.01, (e - s - lt) / 0.01); a = 0.38 * (Math.sin(TAU * 880 * t) + Math.sin(TAU * 1175 * t)) * (Math.sin(TAU * 28 * t) >= 0 ? 1 : 0.55) * env; } return a; },
            zil2: (t) => { const c = t % 3, notes = [523, 659, 784, 1047]; let a = 0; for (let k = 0; k < 4; k++) { const lt = c - k * 0.4; if (lt >= 0 && lt < 0.9) a += 0.35 * Math.sin(TAU * notes[k] * t) * Math.exp(-lt * 4) * Math.min(1, lt / 0.01); } return a; },
            zil3: (t) => { const c = t % 1.6; for (let k = 0; k < 4; k++) { const lt = c - k * 0.2; if (lt >= 0 && lt < 0.12) return 0.4 * Math.sign(Math.sin(TAU * 1000 * t)) * Math.min(1, lt / 0.005, (0.12 - lt) / 0.005); } return 0; },
            zil4: (t) => { const c = t % 1.6, f = c < 0.8 ? 600 + 750 * (c / 0.8) : 1350 - 750 * ((c - 0.8) / 0.8); ph += TAU * f / sr; return 0.4 * Math.sin(ph); },
          };
          for (const [name, g] of Object.entries(gens)) {
            const buf = Buffer.alloc(44 + n * 2);
            buf.write('RIFF', 0); buf.writeUInt32LE(36 + n * 2, 4); buf.write('WAVEfmt ', 8);
            buf.writeUInt32LE(16, 16); buf.writeUInt16LE(1, 20); buf.writeUInt16LE(1, 22);
            buf.writeUInt32LE(sr, 24); buf.writeUInt32LE(sr * 2, 28); buf.writeUInt16LE(2, 32); buf.writeUInt16LE(16, 34);
            buf.write('data', 36); buf.writeUInt32LE(n * 2, 40);
            for (let i = 0; i < n; i++) buf.writeInt16LE(Math.round(Math.max(-1, Math.min(1, g(i / sr))) * 32000), 44 + i * 2);
            fs.writeFileSync('assets/' + name + '.wav', buf);
          }
          const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          j.expo.name = 'Düzenli Hatırlatıcı';
          j.expo.slug = 'hatirlatici';
          j.expo.android = { ...(j.expo.android || {}), package: 'com.alikemal.hatirlatici', permissions: ['POST_NOTIFICATIONS', 'VIBRATE', 'RECEIVE_BOOT_COMPLETED', 'SCHEDULE_EXACT_ALARM', 'com.android.alarm.permission.SET_ALARM'] };
          j.expo.plugins = [...(j.expo.plugins || []), ['expo-notifications', { sounds: ['./assets/zil1.wav', './assets/zil2.wav', './assets/zil3.wav', './assets/zil4.wav'] }]];
          fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          JS

      - name: Android projesi olustur
        working-directory: app
        run: npx expo prebuild --platform android

      - name: APK derle
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hatirlatici-apk
          path: app/android/app/build/outputs/apk/release/*.apk
